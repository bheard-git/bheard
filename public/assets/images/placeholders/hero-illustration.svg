<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="hero-ill-glow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#F97316" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="building-grad" x1="0%" y1="0%" x2="0%" y2="100%">
